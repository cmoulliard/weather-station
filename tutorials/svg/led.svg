<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="100%" height="100%">
  <defs>
    <style>
      .board { fill: #1a1a3a; stroke: #33363d; stroke-width: 2; }
      .pad { fill: #d4a84b; stroke: #b88d22; stroke-width: 1; }
      .pin-label { font-family: monospace; font-size: 10px; fill: #555; }
      .pin-highlight { font-weight: bold; }
      .wire-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 11px; fill: #777; }
      .board-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ddd; }
      .board-sublabel { font-family: Arial, sans-serif; font-size: 9px; fill: #999; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="310" y="30" text-anchor="middle" class="title">LED Blink Circuit</text>
  <text x="310" y="48" text-anchor="middle" class="subtitle">ESP32-C3 Super Mini &#8212; GPIO3 (+) &#8594; 220&#937; &#8594; Red LED &#8594; GND (&#8722;)</text>

  <!-- ==================== ESP32-C3 Board ==================== -->
  <g transform="translate(140, 70)">
    <!-- Board body -->
    <rect class="board" x="0" y="0" width="130" height="300" rx="6"/>

    <!-- USB-C connector -->
    <rect x="35" y="-8" width="60" height="16" rx="4" fill="#888"/>
    <rect x="42" y="-10" width="46" height="8" rx="3" fill="#aaa"/>

    <!-- Board labels -->
    <text x="65" y="130" text-anchor="middle" class="board-label">ESP32-C3</text>
    <text x="65" y="146" text-anchor="middle" class="board-sublabel">Super Mini</text>

    <!-- Left side pins (top to bottom): GPIO5, 6, 7, 8, 9, 10, 20, 21 -->
    <circle class="pad" cx="0" cy="40" r="5"/>
    <text x="-12" y="44" text-anchor="end" class="pin-label">GPIO5</text>

    <circle class="pad" cx="0" cy="70" r="5"/>
    <text x="-12" y="74" text-anchor="end" class="pin-label">GPIO6</text>

    <circle class="pad" cx="0" cy="100" r="5"/>
    <text x="-12" y="104" text-anchor="end" class="pin-label">GPIO7</text>

    <circle class="pad" cx="0" cy="130" r="5"/>
    <text x="-12" y="134" text-anchor="end" class="pin-label">GPIO8</text>

    <circle class="pad" cx="0" cy="160" r="5"/>
    <text x="-12" y="164" text-anchor="end" class="pin-label">GPIO9</text>

    <circle class="pad" cx="0" cy="190" r="5"/>
    <text x="-12" y="194" text-anchor="end" class="pin-label">GPIO10</text>

    <circle class="pad" cx="0" cy="220" r="5"/>
    <text x="-12" y="224" text-anchor="end" class="pin-label">GPIO20</text>

    <circle class="pad" cx="0" cy="250" r="5"/>
    <text x="-12" y="254" text-anchor="end" class="pin-label">GPIO21</text>

    <!-- Right side pins (top to bottom): 5V, GND, 3V3, GPIO4, 3, 2, 1, 0 -->
    <circle class="pad" cx="130" cy="40" r="5"/>
    <text x="142" y="44" class="pin-label" fill="#ef4444">5V</text>

    <circle class="pad" cx="130" cy="70" r="5"/>
    <text x="142" y="74" class="pin-label pin-highlight" fill="#333">GND</text>

    <circle class="pad" cx="130" cy="100" r="5"/>
    <text x="142" y="104" class="pin-label" fill="#ef4444">3V3</text>

    <circle class="pad" cx="130" cy="130" r="5"/>
    <text x="142" y="134" class="pin-label">GPIO4</text>

    <circle class="pad" cx="130" cy="160" r="5"/>
    <text x="142" y="164" class="pin-label pin-highlight" fill="#ff3333">GPIO3</text>

    <circle class="pad" cx="130" cy="190" r="5"/>
    <text x="142" y="194" class="pin-label">GPIO2</text>

    <circle class="pad" cx="130" cy="220" r="5"/>
    <text x="142" y="224" class="pin-label">GPIO1</text>

    <circle class="pad" cx="130" cy="250" r="5"/>
    <text x="142" y="254" class="pin-label">GPIO0</text>
  </g>

  <!-- ==================== +/&#8722; labels at pins ==================== -->
  <text x="300" y="226" font-family="Arial, sans-serif" font-size="12" fill="#2ecc71" font-weight="bold">+</text>
  <text x="298" y="242" font-family="Arial, sans-serif" font-size="7" fill="#999">3.3V</text>
  <text x="300" y="136" font-family="Arial, sans-serif" font-size="12" fill="#555" font-weight="bold">&#8722;</text>
  <text x="298" y="152" font-family="Arial, sans-serif" font-size="7" fill="#999">0V</text>

  <!-- ==================== Red wire: GPIO3 &#8594; Resistor ==================== -->
  <line x1="275" y1="230" x2="328" y2="230" stroke="#ff3333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="275" cy="230" r="4" fill="#ff3333"/>
  <!-- Arrow -->
  <polygon points="308,225 318,230 308,235" fill="#f1c40f"/>
  <!-- Wire label -->
  <text x="300" y="220" class="wire-label" fill="#ff3333" text-anchor="middle">GPIO3</text>

  <!-- ==================== 220&#937; Resistor ==================== -->
  <!-- Body -->
  <rect x="328" y="218" width="100" height="24" rx="5" fill="#f5cba7" stroke="#d4a574" stroke-width="1.5"/>
  <!-- Band 1: Red (digit 2) -->
  <rect x="340" y="220" width="7" height="20" rx="1" fill="#e74c3c"/>
  <!-- Band 2: Red (digit 2) -->
  <rect x="354" y="220" width="7" height="20" rx="1" fill="#e74c3c"/>
  <!-- Band 3: Black (digit 0) -->
  <rect x="368" y="220" width="7" height="20" rx="1" fill="#1a1a1a"/>
  <!-- Band 4: Black (multiplier &#215;1) -->
  <rect x="382" y="220" width="7" height="20" rx="1" fill="#1a1a1a"/>
  <!-- Band 5: Brown (tolerance &#177;1%) -->
  <rect x="404" y="220" width="7" height="20" rx="1" fill="#a04000"/>
  <!-- Band color labels above -->
  <text x="343" y="212" fill="#e74c3c" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Red</text>
  <text x="357" y="212" fill="#e74c3c" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Red</text>
  <text x="371" y="212" fill="#888" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Blk</text>
  <text x="385" y="212" fill="#888" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Blk</text>
  <text x="407" y="212" fill="#a04000" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Brn</text>
  <!-- Band meaning labels below -->
  <text x="343" y="253" fill="#999" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">2</text>
  <text x="357" y="253" fill="#999" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">2</text>
  <text x="371" y="253" fill="#999" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">0</text>
  <text x="385" y="253" fill="#999" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">&#215;1</text>
  <text x="407" y="253" fill="#999" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">&#177;1%</text>
  <!-- Leads -->
  <line x1="328" y1="230" x2="323" y2="230" stroke="#888" stroke-width="2"/>
  <line x1="428" y1="230" x2="433" y2="230" stroke="#888" stroke-width="2"/>
  <!-- Resistor value label -->
  <text x="378" y="268" fill="#b89850" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">220&#937;</text>

  <!-- ==================== Blue wire: Resistor &#8594; LED ==================== -->
  <line x1="428" y1="230" x2="468" y2="230" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrow -->
  <polygon points="450,225 460,230 450,235" fill="#f1c40f"/>

  <!-- ==================== Red LED ==================== -->
  <!-- Label -->
  <text x="492" y="193" fill="#cc3333" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Red LED</text>
  <!-- LED dome -->
  <ellipse cx="492" cy="230" rx="20" ry="16" fill="#e74c3c" opacity="0.85" stroke="#c0392b" stroke-width="1.5"/>
  <ellipse cx="492" cy="228" rx="11" ry="9" fill="#ff8888" opacity="0.4"/>
  <!-- Diode symbol (triangle + bar) -->
  <polygon points="484,222 500,230 484,238" fill="#c0392b"/>
  <line x1="500" y1="222" x2="500" y2="238" stroke="#c0392b" stroke-width="2"/>
  <!-- Anode lead (long leg, +) -->
  <line x1="472" y1="230" x2="465" y2="230" stroke="#999" stroke-width="2"/>
  <!-- Cathode lead (short leg, &#8722;) -->
  <line x1="512" y1="230" x2="518" y2="230" stroke="#999" stroke-width="2"/>
  <!-- +/&#8722; labels -->
  <text x="472" y="206" fill="#2ecc71" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+</text>
  <text x="512" y="206" fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&#8722;</text>
  <text x="472" y="260" fill="#999" font-family="Arial, sans-serif" font-size="7" text-anchor="middle">long leg</text>
  <text x="512" y="260" fill="#999" font-family="Arial, sans-serif" font-size="7" text-anchor="middle">short leg</text>

  <!-- ==================== Green wire: LED cathode &#8594; GND (curved right, not along board) ==================== -->
  <path d="M 518,230 C 575,230 565,140 275,140"
        fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="518" cy="230" r="4" fill="#16a34a"/>
  <circle cx="275" cy="140" r="4" fill="#16a34a"/>
  <!-- Arrow on return wire (pointing left, toward GND) -->
  <polygon points="430,144 420,140 430,136" fill="#f1c40f"/>
  <!-- Wire label -->
  <text x="540" y="180" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">GND</text>

  <!-- ==================== Legend ==================== -->
  <g transform="translate(80, 393)">
    <rect x="0" y="0" width="460" height="38" rx="6" fill="#f5f5f5" stroke="#ddd"/>
    <polygon points="15,10 25,14 15,18" fill="#f1c40f"/>
    <text x="32" y="16" font-family="Arial, sans-serif" font-size="9" fill="#777">Current direction (+ &#8594; &#8722;)</text>
    <text x="210" y="16" font-family="monospace" font-size="9" fill="#555">led = Pin(3, Pin.OUT)</text>
    <text x="15" y="31" font-family="Arial, sans-serif" font-size="8" fill="#999" font-style="italic">GPIO3 (3.3V) &#8594; 220&#937; resistor &#8594; LED anode (+) &#8594; LED cathode (&#8722;) &#8594; GND (0V)</text>
  </g>
</svg>
