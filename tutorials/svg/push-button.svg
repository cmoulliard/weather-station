<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .board { fill: #1a1a3a; stroke: #33363d; stroke-width: 2; }
      .pad { fill: #d4a84b; stroke: #b88d22; stroke-width: 1; }
      .pin-label { font-family: monospace; font-size: 10px; fill: #555; }
      .pin-highlight { font-weight: bold; }
      .wire-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 11px; fill: #777; }
      .board-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ddd; }
      .board-sublabel { font-family: Arial, sans-serif; font-size: 9px; fill: #999; }
      .btn-label { font-family: Arial, sans-serif; font-size: 11px; fill: #555; }
    </style>
  </defs>

  <!-- Title -->
  <text x="310" y="30" text-anchor="middle" class="title">Press Button Circuit</text>
  <text x="310" y="48" text-anchor="middle" class="subtitle">ESP32-C3 Super Mini — GPIO3 with internal pull-up</text>

  <!-- ==================== ESP32-C3 Board ==================== -->
  <g transform="translate(140, 70)">
    <!-- Board body -->
    <rect class="board" x="0" y="0" width="130" height="300" rx="6"/>

    <!-- USB-C connector -->
    <rect x="35" y="-8" width="60" height="16" rx="4" fill="#888"/>
    <rect x="42" y="-10" width="46" height="8" rx="3" fill="#aaa"/>

    <!-- Board labels -->
    <text x="65" y="130" text-anchor="middle" class="board-label">ESP32-C3</text>
    <text x="65" y="146" text-anchor="middle" class="board-sublabel">Super Mini</text>

    <!-- Left side pins (top to bottom): GPIO5, 6, 7, 8, 9, 10, 20, 21 -->
    <circle class="pad" cx="0" cy="40" r="5"/>
    <text x="-12" y="44" text-anchor="end" class="pin-label">GPIO5</text>

    <circle class="pad" cx="0" cy="70" r="5"/>
    <text x="-12" y="74" text-anchor="end" class="pin-label">GPIO6</text>

    <circle class="pad" cx="0" cy="100" r="5"/>
    <text x="-12" y="104" text-anchor="end" class="pin-label">GPIO7</text>

    <circle class="pad" cx="0" cy="130" r="5"/>
    <text x="-12" y="134" text-anchor="end" class="pin-label">GPIO8</text>

    <circle class="pad" cx="0" cy="160" r="5"/>
    <text x="-12" y="164" text-anchor="end" class="pin-label">GPIO9</text>

    <circle class="pad" cx="0" cy="190" r="5"/>
    <text x="-12" y="194" text-anchor="end" class="pin-label">GPIO10</text>

    <circle class="pad" cx="0" cy="220" r="5"/>
    <text x="-12" y="224" text-anchor="end" class="pin-label">GPIO20</text>

    <circle class="pad" cx="0" cy="250" r="5"/>
    <text x="-12" y="254" text-anchor="end" class="pin-label">GPIO21</text>

    <!-- Right side pins (top to bottom): 5V, GND, 3V3, GPIO4, 3, 2, 1, 0 -->
    <circle class="pad" cx="130" cy="40" r="5"/>
    <text x="142" y="44" class="pin-label" fill="#ef4444">5V</text>

    <circle class="pad" cx="130" cy="70" r="5"/>
    <text x="142" y="74" class="pin-label pin-highlight" fill="#333">GND</text>

    <circle class="pad" cx="130" cy="100" r="5"/>
    <text x="142" y="104" class="pin-label" fill="#ef4444">3V3</text>

    <circle class="pad" cx="130" cy="130" r="5"/>
    <text x="142" y="134" class="pin-label">GPIO4</text>

    <circle class="pad" cx="130" cy="160" r="5"/>
    <text x="142" y="164" class="pin-label pin-highlight" fill="#ff3333">GPIO3</text>

    <circle class="pad" cx="130" cy="190" r="5"/>
    <text x="142" y="194" class="pin-label">GPIO2</text>

    <circle class="pad" cx="130" cy="220" r="5"/>
    <text x="142" y="224" class="pin-label">GPIO1</text>

    <circle class="pad" cx="130" cy="250" r="5"/>
    <text x="142" y="254" class="pin-label">GPIO0</text>
  </g>

  <!-- ==================== Push Button ==================== -->
  <g transform="translate(440, 140)">
    <!-- Button body -->
    <rect width="80" height="80" rx="6" fill="#333" stroke="#111" stroke-width="2"/>
    <!-- Button cap -->
    <circle cx="40" cy="40" r="22" fill="#ffcc00" stroke="#d4af37" stroke-width="2"/>
    <circle cx="40" cy="40" r="14" fill="#e6b800"/>
    <!-- 4 terminals -->
    <rect x="-12" y="14" width="12" height="12" rx="2" fill="#ccc" stroke="#666" stroke-width="1"/>
    <rect x="-12" y="54" width="12" height="12" rx="2" fill="#ccc" stroke="#666" stroke-width="1"/>
    <rect x="80" y="14" width="12" height="12" rx="2" fill="#ccc" stroke="#666" stroke-width="1"/>
    <rect x="80" y="54" width="12" height="12" rx="2" fill="#ccc" stroke="#666" stroke-width="1"/>
  </g>
  <text x="480" y="238" text-anchor="middle" class="btn-label">Push Button</text>

  <!-- ==================== Wiring ==================== -->
  <!-- Red wire: GPIO3 (right side, pin 5) → button left-top terminal -->
  <path d="M 275,230 C 340,230 380,160 428,160"
        fill="none" stroke="#ff3333" stroke-width="3" stroke-linecap="round"/>
  <circle cx="275" cy="230" r="4" fill="#ff3333"/>
  <circle cx="428" cy="160" r="4" fill="#ff3333"/>

  <!-- Black wire: GND (right side, pin 2) → button left-bottom terminal -->
  <path d="M 275,140 C 320,140 340,200 428,200"
        fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="275" cy="140" r="4" fill="#1a1a1a"/>
  <circle cx="428" cy="200" r="4" fill="#1a1a1a"/>

  <!-- Wire labels -->
  <text x="370" y="148" class="wire-label" fill="#ff3333" text-anchor="middle">GPIO3</text>
  <text x="370" y="212" class="wire-label" fill="#333" text-anchor="middle">GND</text>

  <!-- ==================== Legend ==================== -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="420" height="36" rx="6" fill="#f5f5f5" stroke="#ddd"/>
    <text x="15" y="23" font-family="Arial, sans-serif" font-size="10" fill="#777">
      Internal pull-up enabled on GPIO3 — button press pulls pin LOW (value = 0)
    </text>
  </g>
</svg>