# Weather data source: "api" (OpenWeatherMap) or "mock" (simulated data)
weather.datasource=${WEATHER_DATASOURCE:mock}
weather.collect.interval=30s

# OpenWeatherMap API
weather.api.key=${OPENWEATHERMAP_API_KEY:}
weather.api.city=${WEATHER_CITY:Silenrieux}
weather.api.cities=${WEATHER_CITIES:Silenrieux,Brussels,Ottignies,Namur,Charleroi,Liege}
quarkus.rest-client.openweathermap.url=https://api.openweathermap.org/data/2.5

# InfluxDB v3
influxdb.enabled=${INFLUXDB_ENABLED:true}
influxdb.url=${INFLUXDB_URL:http://localhost:8181}
influxdb.token=${INFLUXDB_TOKEN:}
influxdb.database=${INFLUXDB_DATABASE:weather}

# BLE (blessed-bluez — Linux/BlueZ only)
ble.enabled=${BLE_ENABLED:false}
ble.device.name=${BLE_DEVICE_NAME:ESP32}
ble.service.uuid=${BLE_SERVICE_UUID:19b10000-e8f2-537e-4f6c-d104768a1214}
ble.sensor.char.uuid=${BLE_SENSOR_CHAR_UUID:19b10001-e8f2-537e-4f6c-d104768a1214}
ble.led.char.uuid=${BLE_LED_CHAR_UUID:19b10002-e8f2-537e-4f6c-d104768a1214}
ble.reconnect.delay.seconds=5

# Health
quarkus.smallrye-health.root-path=/health

# Dev profile: datasource and influxdb are controlled by .env
