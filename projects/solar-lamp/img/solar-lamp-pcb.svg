<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="180mm" height="134mm" viewBox="0 0 180 134"
     font-family="Helvetica, Arial, sans-serif">
  <!--
    Solar lamp PCB (YX8018) - single-sided, copper on the BOTTOM.
    All board coordinates are in millimetres. Board: 38 x 27 mm.
    Panel 1 is 1:1 and is the one to print for etching.
    YX8018 pad order left->right is 4 VCC, 3 CE, 2 GND, 1 LX
    (TO-94 inserted rotated 180 deg; pinout per datasheet Ver2.1, Table 1).
  -->
  <defs>
    <!-- Copper traces -->
    <g id="traces" fill="none" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3,5 H8"/>                          <!-- B+ -> SW pin 1            (VB)  -->
      <path d="M3,12 H16 V8.5 H11 V5"/>            <!-- S+ -> IC VCC -> SW common (VCC) -->
      <path d="M16,8.5 H18.54 V5"/>                <!-- VCC -> L pin 1            (VCC) -->
      <path d="M18.54,12 V15 H3 V18"/>             <!-- IC CE -> S-               (CE)  -->
      <path d="M21.08,12 V23 H3"/>                 <!-- IC GND -> B-              (GND) -->
      <path d="M21.08,23 H34 V17.54"/>             <!-- GND -> LED cathode        (GND) -->
      <path d="M23.62,12 H34 V15"/>                <!-- IC LX -> LED anode        (LX)  -->
      <path d="M28.70,5 V12"/>                     <!-- L pin 2 -> LX             (LX)  -->
    </g>
    <!-- Copper pads -->
    <g id="pads">
      <!-- wire pads: B+, S+, S-, B- -->
      <circle cx="3" cy="5" r="1.25"/><circle cx="3" cy="12" r="1.25"/>
      <circle cx="3" cy="18" r="1.25"/><circle cx="3" cy="23" r="1.25"/>
      <!-- slide switch SS12D07 (3 mm pitch) -->
      <circle cx="8" cy="5" r="1.0"/><circle cx="11" cy="5" r="1.0"/><circle cx="14" cy="5" r="1.0"/>
      <!-- inductor 0307 axial (10.16 mm) -->
      <circle cx="18.54" cy="5" r="1.0"/><circle cx="28.70" cy="5" r="1.0"/>
      <!-- YX8018: VCC, CE, GND, LX (2.54 mm, spread the TO-94 legs) -->
      <circle cx="16" cy="12" r="0.85"/><circle cx="18.54" cy="12" r="0.85"/>
      <circle cx="21.08" cy="12" r="0.85"/><rect x="22.77" y="11.15" width="1.7" height="1.7"/>
      <!-- LED 5 mm: anode, cathode -->
      <circle cx="34" cy="15" r="0.9"/><circle cx="34" cy="17.54" r="0.9"/>
    </g>
    <!-- Drill centres -->
    <g id="holes" fill="#fff">
      <circle cx="3" cy="5" r="0.4"/><circle cx="3" cy="12" r="0.4"/>
      <circle cx="3" cy="18" r="0.4"/><circle cx="3" cy="23" r="0.4"/>
      <circle cx="8" cy="5" r="0.35"/><circle cx="11" cy="5" r="0.35"/><circle cx="14" cy="5" r="0.35"/>
      <circle cx="18.54" cy="5" r="0.35"/><circle cx="28.70" cy="5" r="0.35"/>
      <circle cx="16" cy="12" r="0.3"/><circle cx="18.54" cy="12" r="0.3"/>
      <circle cx="21.08" cy="12" r="0.3"/><circle cx="23.62" cy="12" r="0.3"/>
      <circle cx="34" cy="15" r="0.35"/><circle cx="34" cy="17.54" r="0.35"/>
    </g>
  </defs>

  <rect width="180" height="134" fill="#fff"/>

  <!-- Title -->
  <text x="10" y="9" font-size="4.2" font-weight="bold" fill="#222">Solar lamp PCB (YX8018): single-sided, 38 × 27 mm</text>

  <!-- ============ Panel 1 : copper, 1:1, print for etching ============ -->
  <g transform="translate(10,16)">
    <rect x="0" y="0" width="38" height="27" fill="#fff" stroke="#000" stroke-width="0.15"/>
    <use xlink:href="#traces" stroke="#000"/>
    <use xlink:href="#pads" fill="#000"/>
    <use xlink:href="#holes"/>
  </g>
  <g fill="#222" font-size="3">
    <text x="56" y="20" font-weight="bold">1. Copper layer: print at 100 % (1:1)</text>
    <text x="56" y="25.5" font-size="2.6">Black = copper. Copper is on the bottom of the board, so for</text>
    <text x="56" y="29" font-size="2.6">toner transfer or UV film, print it as shown, NOT mirrored.</text>
    <text x="56" y="32.5" font-size="2.6">Drill: 0.8 mm (IC, LED, switch, L), 1.0 mm (wire pads).</text>
    <!-- scale check -->
    <g stroke="#222" stroke-width="0.3">
      <path d="M56,39 H76 M56,37.5 V40.5 M66,38 V40 M76,37.5 V40.5"/>
    </g>
    <text x="79" y="40" font-size="2.6">20 mm: measure after printing to check the scale</text>
  </g>

  <!-- ============ Panel 2 : component side, 2:1 ============ -->
  <g transform="translate(14,56) scale(2)">
    <rect x="0" y="0" width="38" height="27" fill="#eef4ea" stroke="#555" stroke-width="0.12"/>
    <use xlink:href="#traces" stroke="#e3b98a"/>
    <use xlink:href="#pads" fill="#d39a5c"/>
    <use xlink:href="#holes"/>
    <!-- silkscreen -->
    <g fill="none" stroke="#222" stroke-width="0.18">
      <rect x="6.3" y="3.4" width="9.4" height="3.2" rx="0.3"/>               <!-- switch -->
      <rect x="20.6" y="3.6" width="6.0" height="2.8" rx="1.2"/>              <!-- inductor body -->
      <path d="M19.6,5 H20.6 M26.6,5 H27.6"/>
      <path d="M14.6,10.6 H25.02 V12.8 Q19.81,14.4 14.6,12.8 Z"/>             <!-- TO-94 outline (rotated 180) -->
      <circle cx="34" cy="16.27" r="2.6"/>                                    <!-- LED -->
      <path d="M31.6,17.8 H36.4"/>                                           <!-- LED flat (cathode) -->
    </g>
    <polygon points="25.57,12.5 24.77,12.5 25.17,11.8" fill="#222"/>          <!-- pin 1 marker -->
    <g fill="#222" font-size="1.3" text-anchor="middle">
      <text x="3" y="2.9">B+</text>
      <text x="3" y="10">S+</text>
      <text x="3" y="16">S−</text>
      <text x="3" y="26.3">B−</text>
      <text x="11" y="2.6">SW</text>
      <text x="23.6" y="2.7">L 470 µH</text>
      <text x="19.8" y="17.4" font-size="1.2" font-weight="bold">YX8018</text>
      <g font-size="0.75">
        <text x="16" y="15.6">VCC</text><text x="18.54" y="15.6">CE</text>
        <text x="21.08" y="15.6">GND</text><text x="23.62" y="15.6">LX</text>
      </g>
      <text x="31" y="15.4" font-size="1">A</text>
      <text x="31" y="18.2" font-size="1">K</text>
      <text x="34" y="21.6">LED</text>
    </g>
  </g>
  <g fill="#222">
    <text x="14" y="117" font-size="3" font-weight="bold">2. Component side (assembly), 2:1</text>
    <text x="14" y="121.5" font-size="2.5">Parts go on this side. Copper shown faintly underneath.</text>
  </g>

  <!-- ============ Panel 3 : copper side (soldering view), 2:1 ============ -->
  <g transform="translate(94,56) scale(2)">
    <rect x="0" y="0" width="38" height="27" fill="#efe4cc" stroke="#555" stroke-width="0.12"/>
    <g transform="translate(38,0) scale(-1,1)">
      <use xlink:href="#traces" stroke="#c87533"/>
      <use xlink:href="#pads" fill="#b5652a"/>
      <use xlink:href="#holes"/>
    </g>
    <g fill="#222" font-size="1.3" text-anchor="middle">
      <text x="35" y="2.9">B+</text>
      <text x="35" y="10">S+</text>
      <text x="35" y="16">S−</text>
      <text x="35" y="26.3">B−</text>
      <text x="27" y="2.6">SW</text>
      <text x="14.4" y="2.7">L</text>
      <g font-size="0.75">
        <text x="22" y="15.6">VCC</text><text x="19.46" y="15.6">CE</text>
        <text x="16.92" y="15.6">GND</text><text x="14.38" y="15.6">LX</text>
      </g>
      <text x="6.4" y="15.4" font-size="1">A</text>
      <text x="6.4" y="18.2" font-size="1">K</text>
    </g>
  </g>
  <g fill="#222">
    <text x="94" y="117" font-size="3" font-weight="bold">3. Copper side (soldering view), 2:1</text>
    <text x="94" y="121.5" font-size="2.5">How the board looks when flipped over to solder.</text>
  </g>

  <text x="10" y="130" font-size="2.4" fill="#555">YX8018 pads, left to right: <tspan font-weight="bold">4 VCC · 3 CE · 2 GND · 1 LX</tspan> — the TO-94 goes in rotated 180°; the square pad is pin 1 (LX). Datasheet Ver2.1, Table 1.</text>
</svg>
